[package]
name = "seekcli"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "A local CLI coding agent: DeepSeek + tools + a harness (ReAct loop, policy gate, session event log, MCP)."
repository = "https://github.com/yuxuetr/seekcli"
homepage = "https://github.com/yuxuetr/seekcli"
readme = "README.md"
keywords = ["agent", "cli", "llm", "deepseek", "mcp"]
categories = ["command-line-utilities", "development-tools"]
# Ship only what a build needs. Recorded LLM fixtures are ~76K of test data and
# examples/ is documentation, not code — neither belongs in a published crate.
include = ["src/**/*", "README.md", "LICENSE", "CHANGELOG.md"]
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.11.1"
chrono = {version = "0.4", features = ["serde"]}
clap = {version = "4.4", features = ["derive"]}
colored = "2.0"
futures-util = "0.3"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
indicatif = "0.17"
# rustls rather than the default native-tls. Two reasons, both about shipping
# binaries: cross-compiling to aarch64-linux needs an aarch64 libssl that the
# release runner does not have, and a native-tls build dynamically links the
# builder's libssl -- so a tarball built on ubuntu-latest will not start on a
# distro carrying a different one. `native-roots` keeps reading the OS trust
# store, so a corporate / MITM proxy's own CA still works; and
# `macos-system-configuration` is a default feature that must be re-listed
# here, since it is what picks up the macOS system proxy.
reqwest = {version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2", "macos-system-configuration", "rustls-tls-native-roots"]}
rustyline = "12.0"
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
shlex = "2.0.1"
tokio = {version = "1", features = ["full"]}
toml = "0.8"
uuid = {version = "1.0", features = ["v4"]}

[dev-dependencies]
# `start_paused` lets a deadline test advance the clock instead of sleeping,
# so verifying a 600s timeout costs no wall-clock time. Dev-only: it must not
# reach the shipped binary.
tokio = {version = "1", features = ["test-util"]}

[profile.dev.package."*"]
debug = 1
