name: pages

# 只在文档或站点配置变化时重建；纯代码提交不触发。
on:
  push:
    branches:
      - main
    paths:
      - "**.md"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      # 钉版本：mdbook 的 slug 规则决定中文锚点能否对上 GitHub 的写法，
      # 升级前用本地构建核对一遍跨文档锚点。
      - name: Install mdBook
        run: |
          curl -sSfL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin
      - name: Build
        run: python3 site/stage.py && mdbook build site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/book
      - id: deployment
        uses: actions/deploy-pages@v5
