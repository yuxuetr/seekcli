[default.extend-words]
PNGf = "PNGf"
PN = "PN"
# Rust TUI crate name, not a misspelling of "ratatouille"
ratatui = "ratatui"

[files]
# typos runs over the whole repo (pass_filenames: false), so the
# pre-commit-level exclude does not reach it -- list fixtures here too.
extend-exclude = ["CHANGELOG.md", "notebooks/*", "tests/fixtures/**"]
